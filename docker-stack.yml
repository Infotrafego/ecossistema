# ═══════════════════════════════════════════════════════════════
# Ecossistema Infotráfego · Docker Swarm stack (Traefik)
# ═══════════════════════════════════════════════════════════════
# Deploy via Portainer (Stacks → Add stack) ou:
#   docker stack deploy -c docker-stack.yml ecossistema
#
# As variáveis ${...} são preenchidas no Portainer (aba "Environment variables")
# ou num .env ao lado deste arquivo. Veja .env.example pra a lista completa.
#
# IMPORTANTE: as vars NEXT_PUBLIC_* são embutidas na imagem em BUILD-TIME (no
# GitHub Actions). Aqui só entram os segredos de RUNTIME (service role, tokens).

services:
  ecossistema:
    image: ${IMAGE:-ghcr.io/infotrafego/ecossistema:latest}
    environment:
      # Runtime (server-only) — NUNCA expostos ao browser
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_API_VERSION: ${META_API_VERSION:-v21.0}
      CLICKUP_API_TOKEN: ${CLICKUP_API_TOKEN}
      # Controle de cota da Marketing API (~200 chamadas/hora)
      META_MAX_CALLS_PER_RUN: ${META_MAX_CALLS_PER_RUN:-150}
      META_MIN_CALL_INTERVAL_MS: ${META_MIN_CALL_INTERVAL_MS:-250}
      # ⚠ Trava de escrita da Fase 2b. VAZIO = nenhuma conta aceita ação de
      # escrita. Liberar conta por conta, só com autorização do Pablo.
      META_WRITE_ALLOWED_ACCOUNTS: ${META_WRITE_ALLOWED_ACCOUNTS:-}
      META_SANDBOX_ACCOUNTS: ${META_SANDBOX_ACCOUNTS:-}
      # Sync diário no próprio container (exige replicas: 1, abaixo)
      SYNC_CRON_ENABLED: ${SYNC_CRON_ENABLED:-false}
      SYNC_HORA_UTC: ${SYNC_HORA_UTC:-7}
      SYNC_SECRET: ${SYNC_SECRET:-}
      # Também disponível em runtime (redirects/SSR); o valor de build manda no client
      NEXT_PUBLIC_APP_URL: https://ecossistema.servidordainfotrafego.com.br
    networks:
      - traefik_public
    deploy:
      mode: replicated
      # ⚠ NÃO aumentar sem antes mover o cron pra fora do container: o
      # agendador do sync roda no processo do Next (lib/meta-ads/agendador.ts),
      # então cada réplica extra sincronizaria em paralelo e queimaria cota da
      # Meta em dobro.
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_public"
        - "traefik.http.routers.ecossistema.rule=Host(`ecossistema.servidordainfotrafego.com.br`)"
        - "traefik.http.routers.ecossistema.entrypoints=websecure"
        - "traefik.http.routers.ecossistema.tls=true"
        - "traefik.http.routers.ecossistema.tls.certresolver=le"
        - "traefik.http.services.ecossistema.loadbalancer.server.port=3000"

networks:
  traefik_public:
    external: true
